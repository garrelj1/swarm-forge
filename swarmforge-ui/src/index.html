<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SwarmForge</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5/css/xterm.css"/>
<script src="https://cdn.jsdelivr.net/npm/xterm@5/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8/lib/xterm-addon-fit.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a1a; color: #ccc; font-family: monospace; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 8px 16px; background: #111; border-bottom: 1px solid #333; font-size: 14px; }
  #layout { display: flex; flex: 1; overflow: hidden; }
  #agents { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; flex: 1; padding: 4px; overflow: hidden; }
  .agent-panel { display: flex; flex-direction: column; background: #111; border: 1px solid #333; border-radius: 4px; overflow: hidden; }
  .agent-panel h3 { padding: 4px 8px; background: #222; font-size: 12px; border-bottom: 1px solid #333; }
  .term-wrap { flex: 1; overflow: hidden; padding: 4px; }
  .input-row { display: flex; gap: 4px; padding: 4px; border-top: 1px solid #333; }
  .input-row input { flex: 1; background: #222; border: 1px solid #444; color: #ccc; padding: 4px 6px; font-family: monospace; font-size: 12px; border-radius: 3px; }
  .input-row button { background: #333; border: 1px solid #555; color: #ccc; padding: 4px 8px; cursor: pointer; border-radius: 3px; font-size: 12px; }
  .input-row button:hover { background: #444; }
  #messages-panel { width: 280px; display: flex; flex-direction: column; border-left: 1px solid #333; background: #111; }
  #messages-panel h3 { padding: 6px 10px; background: #222; font-size: 12px; border-bottom: 1px solid #333; }
  #messages { flex: 1; overflow-y: auto; padding: 6px; font-size: 11px; line-height: 1.6; }
  .msg { margin-bottom: 4px; }
  .msg .role { color: #7aa2f7; font-weight: bold; }
</style>
</head>
<body>
<header>SwarmForge</header>
<div id="layout">
  <div id="agents"></div>
  <div id="messages-panel">
    <h3>Messages</h3>
    <div id="messages"></div>
  </div>
</div>
<script>
const terminals = {};

function createPanel(role) {
  const panel = document.createElement('div');
  panel.className = 'agent-panel';
  panel.innerHTML = `
    <h3>${role}</h3>
    <div class="term-wrap" id="term-${role}"></div>
    <div class="input-row">
      <input id="input-${role}" type="text" placeholder="send keys…"
        onkeydown="if(event.key==='Enter'){sendKeys('${role}')}"/>
      <button onclick="sendKeys('${role}')">Send</button>
      <button onclick="sendEnter('${role}')">↵</button>
    </div>`;
  document.getElementById('agents').appendChild(panel);

  const term = new Terminal({ scrollback: 5000, fontSize: 12, theme: { background: '#0d0d0d' } });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById(`term-${role}`));
  fit.fit();
  terminals[role] = { term, fit };
}

function sendKeys(role) {
  const el = document.getElementById(`input-${role}`);
  fetch(`/send/${role}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ keys: el.value })
  });
  el.value = '';
}

function sendEnter(role) {
  fetch(`/send/${role}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ keys: '' })
  });
}

const msgs = document.getElementById('messages');
let autoScroll = true;
msgs.addEventListener('scroll', () => {
  autoScroll = msgs.scrollTop + msgs.clientHeight >= msgs.scrollHeight - 10;
});

const es = new EventSource('/events');

es.addEventListener('roles', e => {
  JSON.parse(e.data).forEach(createPanel);
  window.addEventListener('resize', () => {
    Object.values(terminals).forEach(({ fit }) => fit.fit());
  });
});

es.addEventListener('pane', e => {
  const { role, text } = JSON.parse(e.data);
  terminals[role]?.term.write(text);
});

es.addEventListener('message', e => {
  const { role, text } = JSON.parse(e.data);
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = `<span class="role">[${role}]</span> ${text}`;
  msgs.appendChild(div);
  if (autoScroll) msgs.scrollTop = msgs.scrollHeight;
});
</script>
</body>
</html>
