<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SwarmForge</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5/css/xterm.css"/>
<script src="https://cdn.jsdelivr.net/npm/xterm@5/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8/lib/xterm-addon-fit.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a1a; color: #ccc; font-family: monospace; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 8px 16px; background: #111; border-bottom: 1px solid #333; font-size: 14px; }
  #layout { display: flex; flex: 1; overflow: hidden; }
  #agents { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; flex: 1; padding: 4px; overflow: hidden; min-width: 0; }
  .agent-panel { display: flex; flex-direction: column; background: #111; border: 1px solid #333; border-radius: 4px; overflow: hidden; min-height: 0; }
  .agent-panel.maximized { position: fixed; inset: 32px 0 0 0; z-index: 100; border-radius: 0; }
  .agent-panel h3 { padding: 4px 8px; background: #222; font-size: 12px; border-bottom: 1px solid #333; cursor: pointer; user-select: none; }
  .agent-panel h3:hover { background: #2a2a2a; }
  .agent-panel h3 .hint { float: right; opacity: 0.4; font-weight: normal; }
  .term-wrap { flex: 1; overflow: hidden; padding: 4px; min-height: 0; }
  .input-row { display: flex; gap: 4px; padding: 4px; border-top: 1px solid #333; }
  .input-row input { flex: 1; background: #222; border: 1px solid #444; color: #ccc; padding: 4px 6px; font-family: monospace; font-size: 12px; border-radius: 3px; }
  .input-row button { background: #333; border: 1px solid #555; color: #ccc; padding: 4px 8px; cursor: pointer; border-radius: 3px; font-size: 12px; }
  .input-row button:hover { background: #444; }
  #sidebar-divider { width: 5px; background: #2a2a2a; cursor: col-resize; flex-shrink: 0; transition: background 0.1s; }
  #sidebar-divider:hover, #sidebar-divider.dragging { background: #555; }
  #messages-panel { width: 280px; min-width: 120px; display: flex; flex-direction: column; border-left: 1px solid #333; background: #111; flex-shrink: 0; }
  #messages-panel h3 { padding: 6px 10px; background: #222; font-size: 12px; border-bottom: 1px solid #333; }
  #messages { flex: 1; overflow-y: auto; padding: 6px; font-size: 11px; line-height: 1.6; }
  .msg { margin-bottom: 4px; }
  .msg .role { color: #7aa2f7; font-weight: bold; }
</style>
</head>
<body>
<header>SwarmForge</header>
<div id="layout">
  <div id="agents"></div>
  <div id="sidebar-divider"></div>
  <div id="messages-panel">
    <h3>Messages</h3>
    <div id="messages"></div>
  </div>
</div>
<script>
const terminals = {};

function createPanel(role) {
  const panel = document.createElement('div');
  panel.className = 'agent-panel';

  const h3 = document.createElement('h3');
  const hint = document.createElement('span');
  hint.className = 'hint';
  hint.textContent = 'dbl-click to expand';
  h3.textContent = role;
  h3.appendChild(hint);
  h3.addEventListener('dblclick', () => {
    const maximized = panel.classList.toggle('maximized');
    hint.textContent = maximized ? 'dbl-click to restore' : 'dbl-click to expand';
    setTimeout(() => terminals[role]?.fit.fit(), 50);
  });

  const termWrap = document.createElement('div');
  termWrap.className = 'term-wrap';
  termWrap.id = `term-${role}`;

  const input = document.createElement('input');
  input.id = `input-${role}`;
  input.type = 'text';
  input.placeholder = 'send keys…';
  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendKeys(role); });

  const sendBtn = document.createElement('button');
  sendBtn.textContent = 'Send';
  sendBtn.addEventListener('click', () => sendKeys(role));

  const enterBtn = document.createElement('button');
  enterBtn.textContent = '↵';
  enterBtn.addEventListener('click', () => sendEnter(role));

  const inputRow = document.createElement('div');
  inputRow.className = 'input-row';
  inputRow.appendChild(input);
  inputRow.appendChild(sendBtn);
  inputRow.appendChild(enterBtn);

  panel.appendChild(h3);
  panel.appendChild(termWrap);
  panel.appendChild(inputRow);
  document.getElementById('agents').appendChild(panel);

  const term = new Terminal({ scrollback: 5000, fontSize: 12, theme: { background: '#0d0d0d' } });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(termWrap);
  fit.fit();
  terminals[role] = { term, fit };

  // Refit whenever the panel size changes (e.g. window resize, sidebar drag)
  new ResizeObserver(() => fit.fit()).observe(termWrap);
}

// Draggable sidebar divider
const divider = document.getElementById('sidebar-divider');
const messagesPanel = document.getElementById('messages-panel');
divider.addEventListener('mousedown', e => {
  e.preventDefault();
  divider.classList.add('dragging');
  const startX = e.clientX;
  const startWidth = messagesPanel.getBoundingClientRect().width;
  const onMove = e => {
    const newWidth = Math.max(120, startWidth - (e.clientX - startX));
    messagesPanel.style.width = `${newWidth}px`;
  };
  const onUp = () => {
    divider.classList.remove('dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

function sendKeys(role) {
  const el = document.getElementById(`input-${role}`);
  fetch(`/send/${role}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ keys: el.value })
  });
  el.value = '';
}

function sendEnter(role) {
  fetch(`/send/${role}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ keys: '' })
  });
}

const msgs = document.getElementById('messages');
let autoScroll = true;
msgs.addEventListener('scroll', () => {
  autoScroll = msgs.scrollTop + msgs.clientHeight >= msgs.scrollHeight - 10;
});

const es = new EventSource('/events');

es.addEventListener('roles', e => {
  JSON.parse(e.data).roles.forEach(createPanel);
});

es.addEventListener('pane', e => {
  const { role, text } = JSON.parse(e.data);
  terminals[role]?.term.write(text);
});

es.addEventListener('message', e => {
  const { role, text } = JSON.parse(e.data);
  const div = document.createElement('div');
  div.className = 'msg';
  const roleSpan = document.createElement('span');
  roleSpan.className = 'role';
  roleSpan.textContent = `[${role}]`;
  div.appendChild(roleSpan);
  div.appendChild(document.createTextNode(` ${text}`));
  msgs.appendChild(div);
  if (autoScroll) msgs.scrollTop = msgs.scrollHeight;
});
</script>
</body>
</html>
